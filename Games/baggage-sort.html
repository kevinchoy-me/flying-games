<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baggage Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A1830;
    --navy-panel:#102847;
    --navy-panel-2:#132E52;
    --belt-a:#0E2242;
    --belt-b:#173458;
    --amber:#FFB627;
    --amber-dim:#B37E1C;
    --off-white:#F2EFE6;
    --grey:#7C8CA8;
    --green:#3FB68B;
    --red:#E4572E;
    --tag-shadow: rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--navy-deep);
    color:var(--off-white);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }
  #app{
    position:relative;
    height:100dvh;
    width:100%;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,182,39,0.08), transparent 55%),
      var(--navy-deep);
  }

  /* ---------- HEADER / SPLIT-FLAP BOARD ---------- */
  header{
    padding:14px 16px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,182,39,0.15);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1;
  }
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.18em;
    color:var(--amber-dim);
    margin-bottom:4px;
  }
  .brand .title{
    font-weight:800;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  .board{
    display:flex;
    gap:8px;
  }
  .board .cell{
    text-align:center;
  }
  .board .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:0.12em;
    color:var(--grey);
    margin-bottom:3px;
  }
  .flap{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:20px;
    background:#04101F;
    color:var(--amber);
    border:1px solid rgba(255,182,39,0.25);
    border-radius:4px;
    padding:4px 8px;
    min-width:36px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4);
  }
  .flap.pulse{ animation:flapPulse 260ms ease; }
  @keyframes flapPulse{
    0%{ transform:scaleY(0.4); opacity:0.3; }
    100%{ transform:scaleY(1); opacity:1; }
  }

  /* ---------- STRIKES ---------- */
  .strikes{
    display:flex;
    gap:6px;
    padding:8px 16px;
    flex-shrink:0;
  }
  .strike-tag{
    width:26px; height:16px;
    border-radius:3px;
    background:rgba(228,87,46,0.15);
    border:1px solid rgba(228,87,46,0.35);
    position:relative;
  }
  .strike-tag::before{
    content:'';
    position:absolute; left:-4px; top:50%;
    width:5px; height:5px;
    border-radius:50%;
    background:inherit;
    border:inherit;
    transform:translateY(-50%);
  }
  .strike-tag.lost{
    background:var(--red);
    border-color:var(--red);
  }

  /* ---------- BELT LANE ---------- */
  .lane-wrap{
    flex:1;
    position:relative;
    margin:6px 16px;
    border-radius:14px;
    overflow:hidden;
    background:
      repeating-linear-gradient(
        180deg,
        var(--belt-a) 0px, var(--belt-a) 22px,
        var(--belt-b) 22px, var(--belt-b) 44px
      );
    border:1px solid rgba(255,182,39,0.12);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
  }
  .lane-wrap::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,24,48,0.9), transparent 18%, transparent 78%, rgba(10,24,48,0.95));
    pointer-events:none;
  }
  .gate-line{
    position:absolute;
    left:0; right:0;
    bottom:56px;
    height:3px;
    background:repeating-linear-gradient(90deg, var(--amber) 0 10px, transparent 10px 20px);
    opacity:0.85;
    z-index:3;
  }
  .gate-glow{
    position:absolute;
    left:0; right:0;
    bottom:0;
    height:56px;
    background:linear-gradient(180deg, transparent, rgba(255,182,39,0.10));
    z-index:2;
  }

  .bag{
    position:absolute;
    left:50%;
    top:-70px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:4;
    filter:drop-shadow(0 6px 10px var(--tag-shadow));
  }
  .bag .icon{
    width:46px; height:38px;
    background:linear-gradient(180deg,#3E6CB0,#2A4E86);
    border-radius:8px 8px 6px 6px;
    position:relative;
    border:1px solid rgba(255,255,255,0.15);
  }
  .bag .icon::before{ /* handle */
    content:'';
    position:absolute;
    top:-10px; left:50%;
    width:20px; height:12px;
    transform:translateX(-50%);
    border:4px solid #2A4E86;
    border-bottom:none;
    border-radius:8px 8px 0 0;
  }
  .bag .tag{
    margin-top:4px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    background:var(--amber);
    color:#1A1200;
    padding:3px 8px;
    border-radius:3px;
    letter-spacing:0.03em;
    position:relative;
  }
  .bag.result-good .icon{ background:linear-gradient(180deg,#4FCB9C,#2E8F6C); }
  .bag.result-bad .icon{ background:linear-gradient(180deg,#F17A54,#C43F1E); }
  .bag.result-good, .bag.result-bad{ transition:opacity 320ms ease, transform 320ms ease; }
  .bag.pop{ transform:translateX(-50%) scale(1.15); opacity:0; }

  /* ---------- CAROUSEL BUTTONS ---------- */
  .carousels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .carousel-btn{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.04em;
    padding:16px 8px;
    border-radius:12px;
    background:var(--navy-panel);
    border:1.5px solid rgba(255,182,39,0.25);
    color:var(--off-white);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    transition:transform 90ms ease, background 90ms ease, border-color 90ms ease;
  }
  .carousel-btn .city{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--grey);
    text-transform:uppercase;
  }
  .carousel-btn:active{ transform:scale(0.94); }
  .carousel-btn.hit{ background:var(--green); border-color:var(--green); color:#062219; }
  .carousel-btn.miss{ background:var(--red); border-color:var(--red); color:#2A0800; }

  /* ---------- OVERLAYS ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(6,14,28,0.92);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:32px;
    text-align:center;
    z-index:10;
  }
  .overlay.hidden{ display:none; }
  .overlay .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--amber);
    margin-bottom:10px;
  }
  .overlay h1{
    font-size:28px;
    font-weight:800;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .overlay p{
    color:var(--grey);
    font-size:14px;
    line-height:1.5;
    max-width:280px;
    margin:0 0 22px;
  }
  .overlay .stat-row{
    display:flex;
    gap:24px;
    margin-bottom:26px;
  }
  .overlay .stat{
    display:flex; flex-direction:column; align-items:center;
  }
  .overlay .stat .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:30px;
    font-weight:700;
    color:var(--amber);
  }
  .overlay .stat .lbl{
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--grey);
    text-transform:uppercase;
    margin-top:2px;
  }
  .overlay .new-best{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--green);
    letter-spacing:0.08em;
    margin:-14px 0 20px;
  }
  .btn-primary{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    background:var(--amber);
    color:#1A1200;
    border:none;
    padding:15px 34px;
    border-radius:10px;
    transition:transform 90ms ease;
  }
  .btn-primary:active{ transform:scale(0.96); }
  .history{
    margin-top:22px;
    display:flex;
    gap:6px;
  }
  .history .pip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--grey);
    background:var(--navy-panel);
    border:1px solid rgba(255,182,39,0.15);
    border-radius:5px;
    padding:4px 7px;
  }
  .credit{
    position:absolute;
    bottom:10px; left:0; right:0;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--grey);
    opacity:0.6;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="eyebrow">TERMINAL 1 · ARRIVALS</div>
      <div class="title">Baggage Sort</div>
    </div>
    <div class="board">
      <div class="cell">
        <div class="label">SCORE</div>
        <div class="flap" id="scoreFlap">000</div>
      </div>
      <div class="cell">
        <div class="label">BEST</div>
        <div class="flap" id="bestFlap">000</div>
      </div>
    </div>
  </header>

  <div class="strikes" id="strikes"></div>

  <div class="lane-wrap" id="laneWrap">
    <div class="gate-glow"></div>
    <div class="gate-line"></div>
  </div>

  <div class="carousels" id="carousels"></div>

  <div class="overlay" id="startOverlay">
    <div class="eyebrow">NOW BOARDING</div>
    <h1>Baggage Sort</h1>
    <p>Bags drop down the belt. Tap the carousel matching the tag before it crosses the amber line. Three misses and the belt shuts down.</p>
    <button class="btn-primary" id="startBtn">Start Shift</button>
    <div class="history" id="historyRow"></div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="eyebrow" id="endEyebrow">SHIFT OVER</div>
    <h1>Belt Closed</h1>
    <div class="stat-row">
      <div class="stat">
        <div class="num" id="endScore">0</div>
        <div class="lbl">Sorted</div>
      </div>
      <div class="stat">
        <div class="num" id="endBest">0</div>
        <div class="lbl">Best</div>
      </div>
    </div>
    <div class="new-best hidden" id="newBestMsg">★ NEW BEST SCORE</div>
    <button class="btn-primary" id="retryBtn">Next Shift</button>
  </div>

  <div class="credit">Created by Kevin Choy</div>
</div>

<script>
(function(){
  const POOL = [
    {code:'SIN', city:'Singapore'},
    {code:'NRT', city:'Tokyo'},
    {code:'DPS', city:'Bali'},
    {code:'ICN', city:'Seoul'},
    {code:'MNL', city:'Manila'},
    {code:'TPE', city:'Taipei'},
    {code:'HKG', city:'Hong Kong'},
    {code:'PVG', city:'Shanghai'},
  ];

  const STORAGE_BEST = 'baggageSort_highScore';
  const STORAGE_HISTORY = 'baggageSort_history';

  const laneWrap = document.getElementById('laneWrap');
  const carouselsEl = document.getElementById('carousels');
  const scoreFlap = document.getElementById('scoreFlap');
  const bestFlap = document.getElementById('bestFlap');
  const strikesEl = document.getElementById('strikes');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const endScoreEl = document.getElementById('endScore');
  const endBestEl = document.getElementById('endBest');
  const newBestMsg = document.getElementById('newBestMsg');
  const historyRow = document.getElementById('historyRow');

  let score = 0;
  let strikes = 0;
  let best = parseInt(localStorage.getItem(STORAGE_BEST) || '0', 10);
  let activeCodes = [];
  let currentBag = null;
  let fallDuration = 3000;
  let roundActive = false;
  let bagTimeout = null;
  let spawnTimeout = null;

  const MIN_DURATION = 1150;
  const DURATION_STEP = 90;

  function pad3(n){ return String(n).padStart(3,'0'); }

  function pulseFlap(el){
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  function renderScoreBoard(){
    scoreFlap.textContent = pad3(score);
    bestFlap.textContent = pad3(best);
  }

  function renderStrikes(){
    strikesEl.innerHTML = '';
    for(let i=0;i<3;i++){
      const d = document.createElement('div');
      d.className = 'strike-tag' + (i < strikes ? ' lost' : '');
      strikesEl.appendChild(d);
    }
  }

  function pickActiveCodes(){
    const shuffled = [...POOL].sort(()=>Math.random()-0.5);
    activeCodes = shuffled.slice(0,4);
  }

  function renderCarousels(){
    carouselsEl.innerHTML = '';
    activeCodes.forEach(dest=>{
      const btn = document.createElement('button');
      btn.className = 'carousel-btn';
      btn.dataset.code = dest.code;
      btn.innerHTML = dest.code + '<span class="city">' + dest.city + '</span>';
      btn.addEventListener('click', ()=>handleTap(dest.code, btn));
      carouselsEl.appendChild(btn);
    });
  }

  function renderHistory(){
    const hist = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
    historyRow.innerHTML = '';
    hist.slice(0,5).forEach(v=>{
      const pip = document.createElement('div');
      pip.className = 'pip';
      pip.textContent = v;
      historyRow.appendChild(pip);
    });
  }

  function saveResult(finalScore){
    if(finalScore > best){
      best = finalScore;
      localStorage.setItem(STORAGE_BEST, String(best));
    }
    const hist = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
    hist.unshift(finalScore);
    localStorage.setItem(STORAGE_HISTORY, JSON.stringify(hist.slice(0,5)));
  }

  function clearBag(){
    if(currentBag && currentBag.el && currentBag.el.parentNode){
      currentBag.el.parentNode.removeChild(currentBag.el);
    }
    currentBag = null;
    if(bagTimeout){ clearTimeout(bagTimeout); bagTimeout = null; }
  }

  function spawnBag(){
    if(!roundActive) return;
    const laneHeight = laneWrap.clientHeight;
    const gateOffset = 56; // matches CSS bottom offset of gate
    const travel = laneHeight - gateOffset + 70; // start above lane

    const dest = activeCodes[Math.floor(Math.random()*activeCodes.length)];
    const el = document.createElement('div');
    el.className = 'bag';
    el.innerHTML = '<div class="icon"></div><div class="tag">' + dest.code + '</div>';
    laneWrap.appendChild(el);

    currentBag = { code: dest.code, el, resolved:false };

    requestAnimationFrame(()=>{
      el.style.transition = 'top ' + fallDuration + 'ms linear';
      el.style.top = travel + 'px';
    });

    bagTimeout = setTimeout(()=>{
      if(currentBag && !currentBag.resolved){
        resolveBag(false, null);
      }
    }, fallDuration + 30);
  }

  function resolveBag(correct, btnEl){
    if(!currentBag || currentBag.resolved) return;
    currentBag.resolved = true;
    if(bagTimeout){ clearTimeout(bagTimeout); bagTimeout = null; }

    const bagEl = currentBag.el;
    bagEl.classList.add(correct ? 'result-good' : 'result-bad');

    if(btnEl){
      btnEl.classList.add(correct ? 'hit' : 'miss');
      setTimeout(()=> btnEl.classList.remove('hit','miss'), 220);
    }

    requestAnimationFrame(()=>{
      bagEl.classList.add('pop');
    });
    setTimeout(()=>{
      if(bagEl.parentNode) bagEl.parentNode.removeChild(bagEl);
    }, 340);

    currentBag = null;

    if(correct){
      score++;
      fallDuration = Math.max(MIN_DURATION, fallDuration - DURATION_STEP);
      pulseFlap(scoreFlap);
      renderScoreBoard();
    } else {
      strikes++;
      renderStrikes();
    }

    if(strikes >= 3){
      endRound();
      return;
    }

    spawnTimeout = setTimeout(spawnBag, 380);
  }

  function handleTap(code, btnEl){
    if(!roundActive || !currentBag) return;
    resolveBag(currentBag.code === code, btnEl);
  }

  function startRound(){
    score = 0;
    strikes = 0;
    fallDuration = 3000;
    roundActive = true;
    renderScoreBoard();
    renderStrikes();
    pickActiveCodes();
    renderCarousels();
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    clearBag();
    spawnTimeout = setTimeout(spawnBag, 400);
  }

  function endRound(){
    roundActive = false;
    if(spawnTimeout){ clearTimeout(spawnTimeout); spawnTimeout = null; }
    clearBag();
    const isNewBest = score > 0 && score >= best && score === Math.max(score, best);
    const wasBestBefore = best;
    saveResult(score);
    endScoreEl.textContent = pad3(score);
    endBestEl.textContent = pad3(best);
    newBestMsg.classList.toggle('hidden', score <= wasBestBefore);
    renderScoreBoard();
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startRound);
  retryBtn.addEventListener('click', startRound);

  renderScoreBoard();
  renderStrikes();
  renderHistory();
})();
</script>
</body>
</html>
