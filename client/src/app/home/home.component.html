<div class="min-h-[100dvh] bg-[#0A1830] text-[#F2EFE6]">
  <header class="px-5 pb-4 border-b border-white/10 pt-[max(1.5rem,env(safe-area-inset-top))]">
    <p class="font-mono text-[10px] tracking-[0.2em] text-[#B37E1C]">TERMINAL 1</p>
    <h1 class="text-2xl font-extrabold tracking-tight">Hangar Games</h1>
    <p class="text-sm text-[#7C8CA8] mt-1">Pick a game to play.</p>
  </header>

  <main class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4 max-w-3xl mx-auto">
    @for (game of games; track game.id) {
      <a
        [routerLink]="['/play', game.id]"
        class="group flex flex-col gap-3 min-h-[44px] rounded-2xl p-4 bg-[#102847] border border-white/10 active:scale-[0.98] transition-transform"
      >
        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-full" [style.backgroundColor]="game.accent"></span>
          <span class="font-mono text-[10px] tracking-[0.15em] text-[#7C8CA8]">{{ game.eyebrow | uppercase }}</span>
        </div>
        <h2 class="text-lg font-bold leading-tight">{{ game.title }}</h2>
        <p class="text-sm text-[#7C8CA8] leading-snug">{{ game.tagline }}</p>
        <span
          class="mt-auto inline-flex items-center justify-center min-h-[44px] rounded-xl font-semibold text-sm"
          [style.color]="game.accent"
        >
          Play &rarr;
        </span>
      </a>
    }
  </main>
</div>
